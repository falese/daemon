<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HTML Component Renderer</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#f5f7fb; margin:0; }
    .container { max-width: 840px; margin:40px auto; background:#fff; padding:2rem 2.5rem 3rem; border-radius:14px; box-shadow:0 4px 32px -8px rgba(0,0,0,.15); }
    h1 { margin:0 0 .3rem; font-size:1.9rem; letter-spacing:.5px; }
    .subtitle { margin:0 0 1.5rem; color:#666; }
    .status { display:flex; align-items:center; gap:.6rem; margin-bottom:1.25rem; font-size:.95rem; }
    .dot { width:12px; height:12px; border-radius:50%; background:#bbb; box-shadow:0 0 0 3px #00000008; }
    .dot.connecting { background:#ff9800; }
    .dot.connected { background:#4caf50; }
    .dot.disconnected { background:#f44336; }
    #components { display:flex; flex-direction:column; gap:1.25rem; }
    .empty { text-align:center; padding:2.5rem 1rem; color:#888; font-size:.95rem; }
    .panel { background:#f9faff; border:1px solid #e7ecf5; border-radius:10px; padding:1.1rem 1.25rem 1.25rem; position:relative; overflow:hidden; }
    .panel:before { content:""; position:absolute; inset:0; background:linear-gradient(145deg,#ffffff88,#f1f5ff); opacity:0; pointer-events:none; transition:opacity .35s; }
    .panel.updating:before { opacity:1; animation:pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:0} 50%{opacity:.4} }
    .component-meta { margin-top:.9rem; font-size:.65rem; text-transform:uppercase; letter-spacing:.5px; color:#8392a7; display:flex; gap:.75rem; }
    .card-title { font-weight:600; font-size:1.15rem; }
    .card-subtitle { color:#6b7280; font-size:.8rem; margin-top:.15rem; }
    .card-content { margin:.75rem 0 .5rem; line-height:1.4; }
    .card-actions { margin-top:.6rem; display:flex; flex-wrap:wrap; gap:.5rem; }
    .notification { border-left:5px solid #2196f3; }
    .notification.success { border-left-color:#4caf50; }
    .notification.error { border-left-color:#f44336; }
    .notification.warning { border-left-color:#ff9800; }
    .notification .notification-title { font-weight:600; }
    .form-title { font-weight:600; margin-bottom:.9rem; font-size:1.05rem; }
    form .form-group { margin-bottom:.75rem; }
    .form-label { display:block; font-size:.75rem; font-weight:600; margin-bottom:.35rem; letter-spacing:.5px; text-transform:uppercase; color:#4b5563; }
    .form-input, .form-select, .form-textarea { width:100%; box-sizing:border-box; padding:.55rem .65rem; font-size:.95rem; border:1px solid #d0d7e2; border-radius:6px; background:#fff; font-family:inherit; }
    .form-textarea { min-height:70px; resize:vertical; }
    button, .btn { cursor:pointer; font-family:inherit; font-weight:500; border:none; border-radius:6px; background:#6366f1; color:#fff; padding:.55rem 1.05rem; font-size:.85rem; line-height:1.1; box-shadow:0 2px 6px -2px rgba(79,70,229,.4); transition:background .2s, transform .15s; }
    button:hover, .btn:hover { background:#4f46e5; }
    button:active, .btn:active { transform:translateY(1px); }
    .btn.secondary { background:#64748b; }
    .btn.secondary:hover { background:#475569; }
    .badge { display:inline-block; background:#e2e8f0; color:#475569; border-radius:100px; padding:.2rem .55rem; font-size:.6rem; font-weight:600; letter-spacing:.5px; text-transform:uppercase; }
    .actions-inline { display:flex; gap:.4rem; flex-wrap:wrap; }
    .action-acked { background:#4caf50 !important; }
    .snapshot-note { font-size:.6rem; font-weight:600; letter-spacing:.6px; color:#64748b; margin-left:auto; }
    .divider { height:1px; background:linear-gradient(90deg,#edf2f7,#dde3ed,#edf2f7); margin:1rem 0 .75rem; border-radius:1px; }
    pre { font-size:.7rem; background:#0f172a; color:#f8fafc; padding:.6rem .8rem; border-radius:6px; overflow:auto; line-height:1.35; }
    .rule-eval { margin-top:.6rem; background:#eef6ff; border:1px solid #d2e8ff; padding:.5rem .6rem .55rem; border-radius:8px; }
    .rule-eval-header { font-size:.6rem; font-weight:600; letter-spacing:.6px; color:#2563eb; text-transform:uppercase; display:flex; gap:.4rem; align-items:center; }
    .rule-badge { background:#2563eb; color:#fff; font-size:.55rem; padding:.15rem .4rem; border-radius:4px; font-weight:600; letter-spacing:.5px; }
    .rule-facts { margin:.4rem 0 0; font-size:.6rem; line-height:1.25; color:#334155; display:flex; flex-wrap:wrap; gap:.35rem; }
    .rule-fact { background:#fff; border:1px solid #c4ddff; padding:.15rem .4rem; border-radius:999px; }
    .slot-region { margin-top:.85rem; border-top:1px solid #e7ecf5; padding-top:.75rem; }
    .slot-label { font-size:.6rem; font-weight:600; letter-spacing:.6px; color:#94a3b8; text-transform:uppercase; margin-bottom:.5rem; }
    .slot-empty { border:1.5px dashed #d1d5db; border-radius:7px; padding:.6rem .8rem; color:#9ca3af; font-size:.75rem; text-align:center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>HTML Component Renderer</h1>
    <p class="subtitle">Prototype renderer consuming daemon realtime envelopes (transport-ws)</p>
    <div class="status"><span id="statusDot" class="dot disconnected"></span><span id="statusText">Disconnected</span><span id="snapshotInfo" class="snapshot-note" style="display:none;">snapshot applied</span></div>
    <div id="components"></div>
    <div id="empty" class="empty">No components yet.<br/>Waiting for updates…</div>
    <div class="divider"></div>
    <details>
      <summary style="cursor:pointer;font-size:.8rem;letter-spacing:.5px;">Debug Stream</summary>
      <pre id="debug"></pre>
    </details>
  </div>
  <script>
    // Global error reporter to surface real parse/runtime errors
    window.addEventListener('error', function(e){
      try {
        const dbg = document.getElementById('debug');
        if (dbg) {
          dbg.textContent += "\n[window.onerror] " + (e.message||'error') + ' at ' + (e.filename||'') + ':' + (e.lineno||'');
        }
      } catch(_){}
    });
    // =============================
    // Transport / Subscription Setup
    // =============================
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const debugPre = document.getElementById('debug');
    const componentsDiv = document.getElementById('components');
    const emptyDiv = document.getElementById('empty');
    const snapshotInfo = document.getElementById('snapshotInfo');

    // Delegate click handling for action buttons (avoids repeated listener attachment)
    componentsDiv.addEventListener('click', (e) => {
      const btn = e.target.closest('.action-btn');
      if (!btn) return;
      const compId = btn.getAttribute('data-comp-id');
      const idx = parseInt(btn.getAttribute('data-index'), 10);
      const txt = btn.getAttribute('data-text');
      const actionType = btn.getAttribute('data-action-type') || 'CLICK';
      sendAction(compId, actionType, { buttonIndex: idx, text: txt });
    });

    const WS_PROTOCOL = 'graphql-transport-ws';
    const SUB_QUERY = `subscription DaemonMessages {\n  messages {\n    direction\n    kind\n    payload\n    metadata { correlationId acknowledged error }\n  }\n}`;

    // Local state
    const componentStore = new Map(); // id -> component
    const slotMap = new Map();        // parentId -> Map<slotName, childId | null>

    let ws; let reconnectTimer; let reconnectAttempts = 0;

    function setStatus(state, text){
      statusDot.className = 'dot ' + state; statusText.textContent = text; }

    const MAX_DEBUG_LINES = 400;
    function logDebug(obj){
      const line     = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
      const existing = debugPre.textContent;
      const updated  = (existing + '\n' + line).trim().split('\n');
      debugPre.textContent = updated.slice(-MAX_DEBUG_LINES).join('\n');
    }

    function resolveExplicitWs(){
      try {
        const qp = new URLSearchParams(location.search);
        const daemonParam = qp.get('daemon');
        if (daemonParam) {
          if (/^ws(s)?:/i.test(daemonParam)) return daemonParam; // full ws url
          if (/^\d+$/.test(daemonParam)) { // port only
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            return proto + '://' + location.hostname + ':' + daemonParam + '/graphql';
          }
        }
      } catch(_){}
      const explicitVar = window.DAEMON_WS_URL || (typeof DAEMON_WS_URL !== 'undefined' && DAEMON_WS_URL);
      return explicitVar || null;
    }

    let httpBase = null; // derived HTTP base used for POST actions

    function connect(){
      const explicit = resolveExplicitWs();
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const host = location.host; // renderer host (only used if no explicit)
      const url = explicit || (proto + '://' + host + '/graphql');
      // Derive HTTP base (strip ws(s) scheme if explicit)
      if (explicit) {
        httpBase = explicit.replace(/^ws(s)?:\/\//i, function(m){ return m.toLowerCase()==='wss://' ? 'https://' : 'http://'; }).replace(/\/graphql$/,'');
      } else {
        const hProto = location.protocol === 'https:' ? 'https' : 'http';
        httpBase = hProto + '://' + host;
      }
      setStatus('connecting','Connecting…');
      ws = new WebSocket(url, WS_PROTOCOL);
      ws.onopen = () => {
        reconnectAttempts = 0; setStatus('connected','Connected');
        ws.send(JSON.stringify({ type:'connection_init'}));
      };
      ws.onclose = () => { setStatus('disconnected','Disconnected'); scheduleReconnect(); };
      ws.onerror = () => { setStatus('disconnected','Error'); };
      ws.onmessage = evt => {
        try { handleWs(JSON.parse(evt.data)); } catch(parseErr){ logDebug(['parse error', String(parseErr)]); }
      };
    }

    function scheduleReconnect(){
      clearTimeout(reconnectTimer);
      const delay = Math.min(5000, 500 * Math.pow(1.6, reconnectAttempts++));
      reconnectTimer = setTimeout(connect, delay);
    }

    function handleWs(msg){
      switch(msg.type){
        case 'connection_ack':
          ws.send(JSON.stringify({ id:'daemon-msg-sub', type:'subscribe', payload:{ query: SUB_QUERY } }));
          break;
        case 'next':
          if(msg.payload && msg.payload.data && msg.payload.data.messages){
            handleDaemonEnvelope(msg.payload.data.messages);
          }
          break;
        case 'error':
          logDebug(['GraphQL error', msg]);
          break;
        case 'complete':
          logDebug('Subscription complete');
          break;
        case 'ping':
          ws.send(JSON.stringify({ type:'pong'}));
          break;
      }
    }

    // =============================
    // Envelope Handling
    // =============================
    function handleDaemonEnvelope(env){
      logDebug(env);
      if(env && env.direction === 'COMPONENT'){
        if(env.kind === 'SLOT_ASSIGNMENT'){
          const { parentComponentId, slotName, childComponentId } = env.payload || {};
          if(parentComponentId && slotName){
            if(!slotMap.has(parentComponentId)) slotMap.set(parentComponentId, new Map());
            // Store the ID — child COMPONENT_UPDATE may arrive after this message
            slotMap.get(parentComponentId).set(slotName, childComponentId || null);
          }
        } else if(env.kind === 'STATE_SNAPSHOT'){
          applySnapshot(env.payload);
        } else if(env.kind === 'COMPONENT_UPDATE'){
          upsertComponent(env.payload);
        } else {
          if(env.payload && env.payload.id && env.payload.type) upsertComponent(env.payload);
        }
      } else if(env && env.direction === 'ACTION' && env.kind === 'ACTION_ECHO'){
        const actId = env.payload && env.payload.id;
        if(actId) logDebug('Action echoed by daemon: ' + actId);
      }
      render();
    }

    function applySnapshot(snapshot){
      if(snapshot && snapshot.component){
        upsertComponent(snapshot.component);
        snapshotInfo.style.display = '';
        setTimeout(()=> snapshotInfo.style.display='none', 2500);
      }
      // Optionally process snapshot.actions here
    }

    function upsertComponent(comp){
      if(!comp) return;
      // If content looks like a JSON string, parse it for better display
      if(comp.data && typeof comp.data.content === 'string' && comp.data.content.trim().startsWith('{')){
        try {
          comp.data.content = JSON.parse(comp.data.content);
        } catch(e) {
          logDebug('Note: content looks like JSON but failed to parse: ' + e.message);
        }
      }
      componentStore.set(comp.id, comp);
    }

    // =============================
    // Rendering
    // =============================
    function isSlotted(compId){
      for(const byName of slotMap.values())
        for(const childId of byName.values())
          if(childId === compId) return true;
      return false;
    }

    // Resolve slot assignments for a parent: { slotName -> component | null }
    function resolvedSlots(parentId){
      const result = {};
      const byName = slotMap.get(parentId);
      if(!byName) return result;
      for(const [slotName, childId] of byName)
        result[slotName] = childId ? (componentStore.get(childId) || null) : null;
      return result;
    }

    function render(){
      componentsDiv.innerHTML = '';
      const visible = Array.from(componentStore.values()).filter(c => !isSlotted(c.id));
      if(visible.length === 0){ emptyDiv.style.display=''; return; } else { emptyDiv.style.display='none'; }
      for(const comp of visible){
        componentsDiv.appendChild(renderComponent(comp));
      }
    }

    function renderComponent(comp){
      const wrap = document.createElement('div');
      wrap.className = 'panel component-' + (comp.type || '').toLowerCase();
      wrap.setAttribute('data-component-id', comp.id);
      switch(comp.type){
        case 'CARD':
          wrap.innerHTML = tplCard(comp);
          // Card surface click (excluding buttons) => CLICK
          wrap.addEventListener('click', (ev) => {
            if (ev.target.closest('.action-btn')) return; // ignore button clicks
            sendAction(comp.id, 'CLICK', { timestamp: new Date().toISOString() });
          });
          break;
        case 'NOTIFICATION': wrap.innerHTML = tplNotification(comp); break;
        case 'FORM':
          wrap.innerHTML = tplForm(comp);
          wrap.querySelector('form').addEventListener('submit', (ev) => {
            ev.preventDefault();
            const data = {};
            new FormData(ev.target).forEach((v,k) => data[k] = v);
            sendAction(comp.id, 'SUBMIT', data);
            ev.target.reset();
          });
          break;
        default: wrap.innerHTML = tplDefault(comp); break;
      }
      return wrap;
    }

    function tplSlot(childComp){
      if(!childComp) return `<div class="slot-empty">Empty slot</div>`;
      switch(childComp.type){
        case 'NOTIFICATION': return tplNotification(childComp);
        case 'CARD':         return tplCard(childComp);
        default:             return tplDefault(childComp);
      }
    }

    function tplCard(comp){
      const d = comp.data || {};
      const buttons = (d.buttons||[]).map((b,i)=>
        `<button class="btn secondary action-btn" data-comp-id="${comp.id}" data-index="${i}" data-action-type="BUTTON_CLICK" data-text="${escapeHtml(b.text||'Action')}">${escapeHtml(b.text||'Action')}</button>`
      ).join('');
      const contentHtml = typeof d.content === 'object'
        ? `<pre>${escapeHtml(JSON.stringify(d.content,null,2))}</pre>`
        : escapeHtml(d.content || '');
      const slots = comp.slots || [];
      const detailSlot = slots.includes('detail')
        ? `<div class="slot-region"><div class="slot-label">Detail slot</div>${tplSlot(resolvedSlots(comp.id).detail || null)}</div>`
        : '';
      return `<div class="card-title">${escapeHtml(d.title||'Card')}</div>
              <div class="card-subtitle">${escapeHtml(d.subtitle||'')}</div>
              <div class="card-content">${contentHtml}</div>
              <div class="card-actions">${buttons}</div>
              ${detailSlot}
              ${ruleEval(comp)}
              ${meta(comp)}`;
    }

    function tplNotification(comp){
      const d = comp.data || {};
      const statusClass = escapeHtml((d.status||d.type||'info').toLowerCase());
      return `<div class="notification ${statusClass}">
        <div class="notification-title">${escapeHtml(d.title||'Notification')}</div>
        <div class="card-content">${escapeHtml(d.message||'')}</div>
        ${ruleEval(comp)}
        ${meta(comp)}
      </div>`;
    }

    function tplForm(comp){
      const d = comp.data || {}; const fields = (d.fields||[]).map(f=>fieldHtml(f)).join('');
      return `<div class="form">
        <div class="form-title">${escapeHtml(d.title||'Form')}</div>
        <form data-comp-id="${escapeHtml(comp.id)}">${fields}<div style="margin-top:.5rem;"><button type="submit" class="btn">${escapeHtml(d.submitText||'Submit')}</button></div></form>
        ${ruleEval(comp)}
        ${meta(comp)}
      </div>`;
    }

    function tplDefault(comp){
      return `<div class="card-title">${escapeHtml(comp.type||'Unknown')}</div>
              <div class="card-content"><pre>${escapeHtml(JSON.stringify(comp.data,null,2))}</pre></div>
              ${ruleEval(comp)}
              ${meta(comp)}`;
    }

    function fieldHtml(f){
      switch(f.type){
        case 'textarea': return `<div class="form-group"><label class="form-label">${escapeHtml(f.label||f.name)}</label><textarea name="${escapeHtml(f.name)}" class="form-textarea" ${f.required?'required':''}></textarea></div>`;
        case 'select': return `<div class="form-group"><label class="form-label">${escapeHtml(f.label||f.name)}</label><select name="${escapeHtml(f.name)}" class="form-select" ${f.required?'required':''}>${(f.options||[]).map(o=>`<option value="${escapeHtml(o.value)}">${escapeHtml(o.label)}</option>`).join('')}</select></div>`;
        default: return `<div class="form-group"><label class="form-label">${escapeHtml(f.label||f.name)}</label><input name="${escapeHtml(f.name)}" type="${escapeHtml(f.type||'text')}" class="form-input" ${f.required?'required':''}/></div>`;
      }
    }

    function meta(comp){
      return `<div class="component-meta"><span class="badge">${escapeHtml(comp.type||'')}</span><span>ID ${escapeHtml(comp.id.slice(0,8))}</span><span>${new Date(comp.createdAt||Date.now()).toLocaleTimeString()}</span></div>`;
    }

    function ruleEval(comp){
      const r = comp?.data?._ruleEvaluation; if(!r) return '';
      const facts = r.facts || {}; const factChips = Object.entries(facts).map(([k,v])=>`<span class="rule-fact">${escapeHtml(k)}: ${escapeHtml(typeof v === 'string' ? v : Array.isArray(v)? v.join(',') : JSON.stringify(v))}</span>`).join('');
      return `<div class="rule-eval"><div class="rule-eval-header"><span class="rule-badge">RULE</span><span>${escapeHtml(r.rule || 'unknown')}</span><span style="margin-left:auto;font-size:.55rem;color:#64748b;">${escapeHtml(r.result||'')}</span></div><div class="rule-facts">${factChips}</div></div>`;
    }

    // =============================
    // Action / Form Submission
    // =============================
    function sendAction(componentId, actionType, data){
      const action = {
        id: 'action-' + Date.now(),
        componentId,
        actionType,
        data: Object.assign({ timestamp: new Date().toISOString() }, data||{}),
        timestamp: new Date().toISOString()
      };
      postAction(action);
    }

    function postAction(action){
      const envelope = {
        direction: 'ACTION',
        payload: action,
        metadata: { acknowledged:false, correlationId: action.id, error:null }
      };
      const target = (window.DAEMON_HTTP_URL || (typeof DAEMON_HTTP_URL !== 'undefined' && DAEMON_HTTP_URL)) || (httpBase || 'http://localhost:3001');
      fetch(target + '/graphql', {
        method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({
          query: 'mutation($m:String!){sendMessage(message:$m)}',
            variables: { m: JSON.stringify(envelope) }
        })
      }).then(r=>r.json()).then(res=>logDebug(['action result',res])).catch(err=>logDebug(['action error', String(err)]));
    }

    function escapeHtml(str){ return String(str).replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;' }[c])); }

    // Kick off
    connect();
  </script>
</body>
</html>
