version: "3.9"
services:
  registry:
    build:
      context: ./component-system/registry
      dockerfile: Dockerfile
    ports:
      - 4000:4000
    networks:
      - component-network

  rust-daemon:
    build:
      context: ./component-system/daemon/rust/component-daemon
      dockerfile: Dockerfile
    ports:
      - 3001:3001
    depends_on:
      - registry
    networks:
      - component-network

  node-daemon:
    build:
      context: ./component-system/daemon
      dockerfile: Dockerfile
    ports:
      - 3002:3001 # host 3002 to allow concurrent run with rust-daemon
    depends_on:
      - registry
    networks:
      - component-network

  react-renderer:
    build:
      context: ./component-system/renderer/frontend
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    depends_on:
      - registry
    networks:
      - component-network

  html-renderer:
    build:
      context: ./component-system/renderer/html
      dockerfile: Dockerfile
    ports:
      - 8081:8080
    depends_on:
      - registry
    networks:
      - component-network

  mongo:
    image: mongo:7
    # Bind to localhost only — the `graph` service reaches mongo over the
    # internal `component-network`, so the host mapping is for local tooling only
    # (mongo shell, Compass) and should not be exposed to the LAN.
    ports:
      - 127.0.0.1:27017:27017
    volumes:
      - mongo-data:/data/db
    networks:
      - component-network

  graph:
    build:
      context: ./component-system/graph
      dockerfile: Dockerfile
    ports:
      - 4100:4100
    environment:
      - MONGODB_URI=mongodb://mongo:27017/daemon-graph
      - GRAPH_PORT=4100
    depends_on:
      - mongo
    networks:
      - component-network

volumes:
  mongo-data:

networks:
  component-network:
    driver: bridge
