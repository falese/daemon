version: "3.9"
services:
  registry:
    build:
      context: ./component-system/registry
      dockerfile: Dockerfile
    ports:
      - 4000:4000
    networks:
      - component-network

  rust-daemon:
    build:
      context: ./component-system/daemon/rust/component-daemon
      dockerfile: Dockerfile
    ports:
      - 3001:3001
    depends_on:
      - registry
    networks:
      - component-network

  node-daemon:
    build:
      context: ./component-system/daemon
      dockerfile: Dockerfile
    ports:
      - 3002:3001 # host 3002 to allow concurrent run with rust-daemon
    depends_on:
      - registry
    networks:
      - component-network

  react-renderer:
    build:
      context: ./component-system/renderer/frontend
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    environment:
      # node-daemon is on host port 3002; rust-daemon on 3001.
      # Override with REACT_APP_DAEMON_PORT=3001 to target rust-daemon.
      - REACT_APP_DAEMON_PORT=3002
    depends_on:
      - registry
    networks:
      - component-network

  html-renderer:
    build:
      context: ./component-system/renderer/html
      dockerfile: Dockerfile
    ports:
      - 8081:8080
    depends_on:
      - registry
    networks:
      - component-network

networks:
  component-network:
    driver: bridge
